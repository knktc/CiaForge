name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle_args: --target aarch64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            asset_name: macos-arm64.dmg
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_args: --target x86_64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            asset_name: macos-x64.dmg
          - name: Windows x64
            os: windows-latest
            target: ""
            bundle_args: --bundles nsis
            bundle_path: src-tauri/target/release/bundle/nsis/*.exe
            asset_name: windows-x64-setup.exe
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native installer
        run: npm run tauri -- build ${{ matrix.bundle_args }}
      - name: Name Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir release-assets
          installer="$(find ${{ matrix.bundle_path }} -type f -print -quit)"
          mv "$installer" "release-assets/CiaForge-v${version}-${{ matrix.asset_name }}"
      - name: Name Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Path release-assets
          $installer = Get-ChildItem '${{ matrix.bundle_path }}' | Select-Object -First 1
          Move-Item $installer.FullName "release-assets/CiaForge-v$version-${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "CiaForge $RELEASE_TAG" --generate-notes
          fi
      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release delete-asset "$RELEASE_TAG" CiaForge-macos.zip --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$RELEASE_TAG" "CiaForge_${version}_aarch64.dmg" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
