name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build macOS disk images
        run: |
          npm run tauri -- build --target aarch64-apple-darwin --bundles dmg --verbose
          npm run tauri -- build --target x86_64-apple-darwin --bundles dmg --verbose
      - name: Name macOS disk images
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          mkdir release-assets
          for architecture in arm64 x64; do
            case "$architecture" in
              arm64) target="aarch64-apple-darwin" ;;
              x64) target="x86_64-apple-darwin" ;;
            esac
            installer="$(find "src-tauri/target/${target}/release/bundle/dmg" -name '*.dmg' -type f -print -quit)"
            test -n "$installer"
            mv "$installer" "release-assets/CiaForge-v${version}-macos-${architecture}.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build native installer
        run: npm run tauri -- build --bundles nsis
      - name: Name Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Path release-assets
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          Move-Item $installer.FullName "release-assets/CiaForge-v$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "CiaForge $RELEASE_TAG" --generate-notes
          fi
      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release delete-asset "$RELEASE_TAG" CiaForge-macos.zip --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset "$RELEASE_TAG" "CiaForge_${version}_aarch64.dmg" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
