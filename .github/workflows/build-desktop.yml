name: Build desktop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CI: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact: CiaForge-macOS-arm64
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact: CiaForge-macOS-x86_64
          - name: Windows
            os: windows-latest
            target: ''
            build_args: ''
            bundle_path: src-tauri/target/release/bundle/**
            artifact: CiaForge-Windows

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend and Rust code
        run: |
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native bundle
        run: npm run tauri -- build ${{ matrix.build_args }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    name: Publish macOS DMGs
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: CiaForge-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets."
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CiaForge $TAG_NAME" \
              --generate-notes
          fi

      - name: Upload desktop installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' asset; do
              gh release upload "$TAG_NAME" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            done
