[package]
name = "ciaforge"
version = "0.2.2"
edition = "2024"

[lib]
name = "ciaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
ciaforge-core = { path = "../crates/ciaforge-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
