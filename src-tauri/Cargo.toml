[package]
name = "ciaforge"
version = "0.2.0"
edition = "2024"

[lib]
name = "ciaforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
