<!doctype html>
<html lang="en" style="background:#101827"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#101827" /><style>html,body{margin:0;background:#101827}</style><link rel="stylesheet" href="/src/web/styles.css" /><title>CiaForge Web</title></head>
<body><main class="web-app"><header><img src="/icon.png" width="32" height="32" style="width:32px;height:32px;visibility:hidden" onload="this.style.visibility='visible'" alt="" /><span>CiaForge Web</span></header><section><h1>Convert 3DS images to CIA</h1><p>Your file stays on this device</p><p id="unsupported" class="unsupported" hidden>This browser cannot save converted files locally. <a href="https://github.com/knktc/CiaForge/releases">Download the desktop app</a></p><label class="picker"><input id="file" type="file" accept=".cci,.3ds" />Choose file</label><div id="preview" hidden><canvas id="icon" width="48" height="48"></canvas><div><strong id="title"></strong><small id="publisher"></small></div></div><p id="selected"></p><button id="action" disabled>Convert to CIA</button><progress id="progress" max="100" value="0" hidden></progress><p id="status" aria-live="polite"></p></section><footer><a href="https://github.com/knktc/CiaForge">View on GitHub</a></footer></main><script type="module" src="/src/web/main.ts"></script></body></html>
